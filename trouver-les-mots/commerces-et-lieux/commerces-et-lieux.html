<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Commerces et Lieux</title>
    <style>
        :root {
            --primary: #34495E;
            --primary-dark: #2C3E50;
            --accent: #2980B9;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #EBF5FB;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #AED6F1;
        }

        .category-badge {
            display: inline-block;
            background: #E8F8F5;
            color: #16A085;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Container de la question avec image */
        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 120px;
        }

        .commerce-img {
            max-height: 180px;
            max-width: 220px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #E5E8E8;
            background-color: #FAFAFA;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.5;
        }

        .question-box strong {
            margin: 0 6px;
            color: var(--accent);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3);
        }

        .btn-action:hover {
            background: #1F618D;
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>🏪 🏬 Les Commerces et Lieux 🛍️ 🏦</h1>
        <p class="subtitle">Devinez le lieu ou sa définition !</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">8</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">8</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Commerces</div>

        <div class="question-container">
            <img id="commerceImage" class="commerce-img" src="" alt="Photo du commerce" style="display: none;">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🎓</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">8</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie</button>
    </div>
</div>

<script>
    // Liste des 52 commerces et lieux
    // Dossier d'images : photos-commerces/
    // Fichiers au format JPG (minuscules, sans accent, tirets à la place des espaces/apostrophes)
    const commercesData = [
        { nom: "boulangerie", imageFile: "boulangerie", definition: "Lieu où l'on achète du pain frais, des baguettes et des viennoiseries" },
        { nom: "poissonnerie", imageFile: "poissonnerie", definition: "Commerce spécialisé dans la vente de poissons et de fruits de mer" },
        { nom: "boucherie", imageFile: "boucherie", definition: "Magasin où l'on achète de la viande fraîche" },
        { nom: "pharmacie", imageFile: "pharmacie", definition: "Lieu où l'on achète des médicaments et des soins de santé" },
        { nom: "épicerie", imageFile: "epicerie", definition: "Petit commerce de quartier qui vend des produits alimentaires divers" },
        { nom: "centre commercial", imageFile: "centre-commercial", definition: "Grand bâtiment regroupant de nombreux magasins et boutiques" },
        { nom: "pompe à essence", imageFile: "pompe-a-essence", definition: "Appareil qui sert à mettre du carburant dans un véhicule" },
        { nom: "fleuriste", imageFile: "fleuriste", definition: "Boutique où l'on vend des fleurs et des compositions florales" },
        { nom: "parfumerie", imageFile: "parfumerie", definition: "Magasin spécialisé dans la vente de parfums et de produits de beauté" },
        { nom: "poste de police", imageFile: "poste-de-police", definition: "Lieu où travaillent les policiers pour assurer la sécurité" },
        { nom: "bureau de poste", imageFile: "bureau-de-poste", definition: "Lieu où l'on envoie des lettres, achète des timbres et retire des colis" },
        { nom: "bureau de tabac", imageFile: "bureau-de-tabac", definition: "Commerce qui vend du tabac, des journaux, du timbre et des jeux à gratter" },
        { nom: "restaurant", imageFile: "restaurant", definition: "Établissement où l'on sert des repas préparés aux clients" },
        { nom: "librairie", imageFile: "librairie", definition: "Boutique spécialisée dans la vente de livres et de bandes dessinées" },
        { nom: "banque", imageFile: "banque", definition: "Établissement financier où l'on dépose ou retire de l'argent" },
        { nom: "café", imageFile: "cafe", definition: "Établissement où l'on peut boire un café ou d'autres boissons" },
        { nom: "office de tourisme", imageFile: "office-de-tourisme", definition: "Lieu d'information pour les visiteurs et les touristes d'une ville" },
        { nom: "piscine", imageFile: "piscine", definition: "Bassin aménagement pour la natation et la baignade" },
        { nom: "magasin de vêtements", imageFile: "magasin-de-vetements", definition: "Boutique qui vend des habits pour hommes, femmes ou enfants" },
        { nom: "magasin de chaussures", imageFile: "magasin-de-chaussures", definition: "Boutique spécialisée dans la vente de chaussures et de baskets" },
        { nom: "salon de coiffure", imageFile: "salon-de-coiffure", definition: "Lieu où l'on se fait couper, laver ou coiffer les cheveux" },
        { nom: "laverie", imageFile: "laverie", definition: "Établissement équipé de machines à laver automatiques en libre-service" },
        { nom: "traiteur", imageFile: "traiteur", definition: "Commerce qui prépare et vend des plats cuisinés à emporter" },
        { nom: "bijouterie", imageFile: "bijouterie", definition: "Magasin qui vend des bijoux, des bagues, des colliers et des montres" },
        { nom: "papeterie", imageFile: "papeterie", definition: "Magasin qui vend du papier, des cahiers et des fournitures de bureau" },
        { nom: "micro crèche", imageFile: "micro-creche", definition: "Structure d'accueil pour garder un petit groupe de jeunes enfants" },
        { nom: "cinéma", imageFile: "cinema", definition: "Lieu où l'on vient regarder des films sur un grand écran" },
        { nom: "école", imageFile: "ecole", definition: "Établissement d'enseignement pour les jeunes enfants" },
        { nom: "collège", imageFile: "college", definition: "Établissement d'enseignement secondaire après l'école élémentaire" },
        { nom: "lycée", imageFile: "lycee", definition: "Établissement d'enseignement secondaire avant l'université" },
        { nom: "quincaillerie", imageFile: "quincaillerie", definition: "Magasin qui vend des outils, des clous, des vis et du matériel de bricolage" },
        { nom: "mercerie", imageFile: "mercerie", definition: "Commerce qui vend des articles pour la couture, du fil et des boutons" },
        { nom: "théâtre", imageFile: "theatre", definition: "Lieu où l'on joue des pièces de théâtre et des spectacles sur scène" },
        { nom: "université", imageFile: "universite", definition: "Établissement d'enseignement supérieur et de recherche" },
        { nom: "agence de voyages", imageFile: "agence-de-voyages", definition: "Entreprise qui vend des séjours, des billets d'avion et des vacances" },
        { nom: "opticien", imageFile: "opticien", definition: "Professionnel qui vend des lunettes de vue, de soleil et des lentilles" },
        { nom: "blanchisserie", imageFile: "blanchisserie", definition: "Établissement où l'on lave et repasse le linge à grande échelle" },
        { nom: "stade", imageFile: "stade", definition: "Grand terrain de sport entouré de tribunes pour le public" },
        { nom: "salle de sport", imageFile: "salle-de-sport", definition: "Espace équipé d'appareils de musculation et de fitness" },
        { nom: "gymnase", imageFile: "gymnase", definition: "Bâtiment couvert aménagé pour la pratique de sports d'intérieur" },
        { nom: "cafétéria", imageFile: "cafeteria", definition: "Restaurant en libre-service où l'on choisit ses plats sur un plateau" },
        { nom: "barbier", imageFile: "barbier", definition: "Salon spécialisé pour le rasage et l'entretien de la barbe" },
        { nom: "hôtel", imageFile: "hotel", definition: "Établissement payant qui propose des chambres aux voyageurs" },
        { nom: "musée", imageFile: "musee", definition: "Lieu où sont conservées et exposées des œuvres d'art ou d'histoire" },
        { nom: "animalerie", imageFile: "animalerie", definition: "Magasin qui vend des animaux de compagnie et des accessoires" },
        { nom: "salon de beauté", imageFile: "salon-de-beaute", definition: "Lieu dédié aux soins du visage, du corps et des ongles" },
        { nom: "bar", imageFile: "bar", definition: "Établissement qui sert principalement des boissons à consommer au comptoir" },
        { nom: "magasin d’optique", imageFile: "magasin-d-optique", definition: "Boutique dédiée à la vente d'équipements visuels et montures" },
        { nom: "cordonnerie", imageFile: "cordonnerie", definition: "Atelier où l'on répare les chaussures et les articles en cuir" },
        { nom: "boutique de souvenirs", imageFile: "boutique-de-souvenirs", definition: "Magasin qui vend des objets touristiques et des cadeaux" },
        { nom: "station-service", imageFile: "station-service", definition: "Lieu où l'on trouve du carburant et des services pour véhicules" },
        { nom: "boutique de maroquinerie", imageFile: "boutique-de-maroquinerie", definition: "Magasin spécialisé dans les sacs à main, valises et porte-monnaie" }
    ];

    const FOLDER_PATH = "photos-commerces/";
    const TOTAL_QUESTIONS = 8;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver le nom du commerce/lieu à partir de sa définition
        commercesData.forEach(item => {
            const distractors = commercesData
                .filter(x => x.nom !== item.nom)
                .map(x => capitalizeFirstLetter(x.nom));

            pool.push({
                category: "🔍 Quel est ce lieu / commerce ?",
                text: `Quel est le nom du lieu correspondant à : <strong>${item.definition}</strong> ?`,
                correct: capitalizeFirstLetter(item.nom),
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        // Type 2 : Retrouver la définition à partir du nom du commerce/lieu
        commercesData.forEach(item => {
            const distractors = commercesData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Quelle est la fonction ?",
                text: `Que fait-on dans : <strong>${item.nom}</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        // Gestion de l'image
        const imgEl = document.getElementById('commerceImage');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! C'est exactement ça !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La bonne réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Expert des Commerces !";
            msgEl.innerText = "Félicitations, vous connaissez parfaitement tous les commerces et lieux !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Bravo !";
            msgEl.innerText = "Très bon score ! Vous maîtrisez une grande partie du vocabulaire des lieux.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Pas mal !";
            msgEl.innerText = "C'est un bon résultat, continuez à réviser le vocabulaire.";
        } else {
            emojiEl.innerText = "📚";
            titleEl.innerText = "À travailler !";
            msgEl.innerText = "Relisez la liste des commerces et réessayez une partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
