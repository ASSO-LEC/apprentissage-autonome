<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualités et Défauts - Vocabulaire B1+/B2</title>
    <style>
        :root {
            --primary: #2C3E50;
            --primary-dark: #1A252F;
            --accent: #8E44AD;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F6F7;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 750px;
            padding: 35px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #F4ECF7;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #D2B4DE;
        }

        .category-badge {
            display: inline-block;
            background: #EAF2F8;
            color: #2980B9;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .question-box {
            font-size: 1.3em;
            font-weight: 500;
            line-height: 1.6;
        }

        .question-box strong {
            margin: 0 4px;
            color: var(--accent);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F8F9F9;
            border: 2px solid #E5E8E8;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .btn-option:hover {
            background: #EBEDEF;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 35px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);
        }

        .btn-action:hover {
            background: #6C3483;
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>🧠 Qualités & Défauts 👤</h1>
        <p class="subtitle">Vocabulaire du caractère et de la personnalité (B1+ / B2)</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">8</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">8</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Vocabulaire</div>

        <div class="question-container">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🎓</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">8</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie. Conseillé par JPJ</button>
    </div>
</div>

<script>
    // Base de données du vocabulaire (Niveau B1+/B2)
    const vocabulaireData = [
        { mot: "qualité", type: "nom", definition: "Trait positif du caractère d'une personne" },
        { mot: "défaut", type: "nom", definition: "Imperfection ou trait négatif du caractère" },
        { mot: "parfait(e)", type: "adjectif", definition: "Qui n'a aucun défaut, irréprochable" },
        { mot: "audacieux / audacieuse", type: "adjectif", definition: "Qui ose prendre des risques, intrépide" },
        { mot: "dynamique", type: "adjectif", definition: "Qui a beaucoup d'énergie et d'enthousiasme" },
        { mot: "décidé(e)", type: "adjectif", definition: "Qui sait ce qu'il/elle veut et prend des décisions rapidement" },
        { mot: "volontaire", type: "adjectif", definition: "Qui fait preuve d'une forte volonté et d'énergie pour agir" },
        { mot: "mou / molle", type: "adjectif", definition: "Qui manque d'énergie, de dynamisme et de réactivité" },
        { mot: "ambition", type: "nom", definition: "Désir vif d'avoir du succès, du pouvoir ou de réussir sa vie" },
        { mot: "responsable", type: "adjectif", definition: "Qui assume ses actes et prend ses devoirs au sérieux" },
        { mot: "sérieux / sérieuse", type: "adjectif", definition: "Rigoureux(se) et digne de confiance dans ce qu'il/elle fait" },
        { mot: "prudent(e)", type: "adjectif", definition: "Qui fait attention à éviter les dangers et les erreurs" },
        { mot: "réfléchi(e)", type: "adjectif", definition: "Qui pense mûrement avant d'agir ou de parler" },
        { mot: "persévérant(e)", type: "adjectif", definition: "Qui n'abandonne pas malgré les difficultés" },
        { mot: "aventurier / aventurière", type: "adjectif/nom", definition: "Qui aime le risque, l'inconnu et les nouvelles expériences" },
        { mot: "impulsif / impulsive", type: "adjectif", definition: "Qui agit sans réfléchir sous le coup de l'émotion" },
        { mot: "optimiste", type: "adjectif", definition: "Qui voit le côté positif des choses et a confiance en l'avenir" },
        { mot: "confiant(e)", type: "adjectif", definition: "Qui a de l'assurance et croit en ses capacités ou aux autres" },
        { mot: "positif / positive", type: "adjectif", definition: "Qui cherche les solutions plutôt que de se concentrer sur les problèmes" },
        { mot: "pessimiste", type: "adjectif", definition: "Qui voit le mauvais côté des choses et attend toujours le pire" },
        { mot: "négatif / négative", type: "adjectif", definition: "Qui a tendance à tout critiquer et à ne voir que les inconvénients" },
        { mot: "réaliste", type: "adjectif", definition: "Qui voit les choses telles qu'elles sont, sans s'illusionner" },
        { mot: "sans illusion", type: "expression", definition: "Qui est lucide et ne se fait pas de fausses idées" },
        { mot: "avoir la tête sur les épaules", type: "expression", definition: "Être lucide, raisonnable et faire preuve de bon sens" },
        { mot: "avoir le sens des réalités", type: "expression", definition: "Comprendre le monde tel qu'il est de façon pragmatique" },
        { mot: "rêveur / rêveuse", type: "adjectif/nom", definition: "Qui est souvent distrait(e) et se perd dans ses pensées ou son imagination" },
        { mot: "opinion personnelle", type: "expression", definition: "Point de vue propre à un individu" },
        { mot: "caractère", type: "nom", definition: "Ensemble des traits psychologiques qui distinguent une personne" },
        { mot: "autonome", type: "adjectif", definition: "Qui est capable d'agir et d'être indépendant(e) sans l'aide des autres" },
        { mot: "capable d’initiative", type: "expression", definition: "Qui sait prendre des décisions et agir de soi-même sans attendre d'ordres" },
        { mot: "n'en faire qu’à sa tête", type: "expression", definition: "Agir de façon entêtée sans écouter les conseils ou consignes des autres" },
        { mot: "individualiste", type: "adjectif", definition: "Qui privilégie son intérêt personnel au détriment du groupe" },
        { mot: "esprit d’équipe", type: "expression", definition: "Capacité à travailler harmonieusement et solidairement avec les autres" },
        { mot: "coopératif / coopérative", type: "adjectif", definition: "Qui aide et participe volontiers au travail collectif" },
        { mot: "tenir compte des autres", type: "expression", definition: "Respecter les besoins et l'opinion des autres personnes" },
        { mot: "sincère", type: "adjectif", definition: "Qui exprime ce qu'il/elle pense ou ressent vraiment, sans mentir" },
        { mot: "franc / franche", type: "adjectif", definition: "Qui parle ouvertement et directement, sans cacher la vérité" },
        { mot: "direct(e)", type: "adjectif", definition: "Qui dit les choses clairement sans détour" },
        { mot: "donner son avis", type: "expression", definition: "Exprimer son opinion sur un sujet" },
        { mot: "hypocrite", type: "adjectif", definition: "Qui feint des sentiments ou des vertus qu'il/elle n'a pas" },
        { mot: "délicat(e)", type: "adjectif", definition: "Qui fait preuve d'attention, de tact et de douceur" },
        { mot: "diplomate", type: "adjectif/nom", definition: "Qui sait gérer les situations difficiles avec tact sans blesser" },
        { mot: "respect des autres", type: "expression", definition: "Considération envers les opinions, droits et sentiments d'autrui" },
        { mot: "maladroit(e)", type: "adjectif", definition: "Qui manque de tact ou d'habileté dans ses actes ou paroles" },
        { mot: "brutal(e)", type: "adjectif", definition: "Qui manque totalement de douceur ou de tact, violent(e) ou très direct(e)" },
        { mot: "sévère", type: "adjectif", definition: "Qui est très exigeant(e) et applique les règles de façon stricte" },
        { mot: "tolérant(e)", type: "adjectif", definition: "Qui accepte les différences d'opinion et le comportement d'autrui" },
        { mot: "laxiste", type: "adjectif", definition: "Qui manque excessivement de fermeté et tolère trop d'erreurs" },
        { mot: "exigeant(e)", type: "adjectif", definition: "Qui demande beaucoup d'efforts et la perfection" },
        { mot: "compréhensif / compréhensive", type: "adjectif", definition: "Qui fait preuve d'empathie et comprend facilement les autres" },
        { mot: "perfectionniste", type: "adjectif", definition: "Qui cherche constamment à tout faire sans le moindre défaut" }
    ];

    const TOTAL_QUESTIONS = 8;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver le mot / l'expression à partir de sa définition
        vocabulaireData.forEach(item => {
            const distractors = vocabulaireData
                .filter(x => x.mot !== item.mot)
                .map(x => capitalizeFirstLetter(x.mot));

            pool.push({
                category: "🔍 Vocabulaire & Signification",
                text: `Quel mot ou expression correspond à : <strong>« ${item.definition} »</strong> ?`,
                correct: capitalizeFirstLetter(item.mot),
                distractors: getRandomItems(distractors, [], 3)
            });
        });

        // Type 2 : Retrouver la définition à partir du mot
        vocabulaireData.forEach(item => {
            const distractors = vocabulaireData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Compréhension",
                text: `Que signifie : <strong>« ${item.mot} »</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3)
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;
        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Excellent ! C'est la bonne réponse.";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La réponse correcte était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Maîtrise Parfaite !";
            msgEl.innerText = "Félicitations ! Votre nuance du vocabulaire du caractère est impeccable.";
        } else if (percentage >= 70) {
            emojiEl.innerText = "👏";
            titleEl.innerText = "Très Bon Niveau !";
            msgEl.innerText = "Beau travail ! Vous maîtrisez bien les nuances des qualités et défauts.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Bon Début !";
            msgEl.innerText = "Résultat encourageant. Continuez à pratiquer pour enrichir votre vocabulaire.";
        } else {
            emojiEl.innerText = "📖";
            titleEl.innerText = "À Réviser !";
            msgEl.innerText = "Relisez bien les définitions des adjectifs et expressions, puis tentez une nouvelle partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
