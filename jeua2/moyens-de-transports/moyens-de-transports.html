<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Moyens de Transport</title>
    <style>
        :root {
            --primary: #C0392B;
            --primary-dark: #922B21;
            --accent: #E67E22;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #FDF2E9;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
            border: 2px solid #F5CBA7;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #FADBD8;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            color: var(--primary-dark);
        }

        .category-badge {
            display: inline-block;
            background: #EDBB99;
            color: #6E2C00;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 120px;
        }

        .transport-img {
            max-height: 160px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #F5CBA7;
            background-color: #FAFAFA;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.5;
        }

        .question-box strong {
            margin: 0 6px;
            color: var(--primary);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(192, 57, 43, 0.3);
        }

        .btn-action:hover {
            background: var(--primary-dark);
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>✈️ 🚢 Les Moyens de Transport 🚲 🚗</h1>
        <p class="subtitle">Devinez le véhicule ou son utilisation !</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Transports</div>
        
        <div class="question-container">
            <img id="transportImage" class="transport-img" src="" alt="Photo du moyen de transport" style="display: none;">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🧳</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    // Liste des 20 transports
    // Dossier d'images : photos-moyens-de-transport/
    // Fichiers au format JPG : avion.jpg, montgolfiere.jpg, velo.jpg, etc.
    const transportsData = [
        { nom: "l'avion", imageFile: "avion", definition: "Un appareil volant avec des ailes pour parcourir de longues distances dans l'air" },
        { nom: "la montgolfière", imageFile: "montgolfiere", definition: "Un grand ballon gonflé d'air chaud qui flotte doucement dans le ciel" },
        { nom: "le vélo", imageFile: "velo", definition: "Un véhicule à deux roues que l'on fait avancer en appuyant sur des pédales" },
        { nom: "le bateau", imageFile: "bateau", definition: "Un véhicule qui flotte et se déplace sur l'eau" },
        { nom: "le bus", imageFile: "bus", definition: "Un grand véhicule à roues qui transporte beaucoup de passagers en ville" },
        { nom: "la voiture", imageFile: "voiture", definition: "Un véhicule automobile à quatre roues pour voyager en famille ou sur la route" },
        { nom: "le deltaplane", imageFile: "deltaplane", definition: "Une aile rigide permettant de voler et de planer dans le vent" },
        { nom: "l'hélicoptère", imageFile: "helicoptere", definition: "Un appareil volant muni d'une grande hélice au-dessus pour décoller à la verticale" },
        { nom: "l'aéroglisseur", imageFile: "aeroglisseur", definition: "Un véhicule qui glisse au-dessus de l'eau ou de la terre grâce à un coussin d'air" },
        { nom: "le camion", imageFile: "camion", definition: "Un grand véhicule lourd conçu pour transporter des marchandises" },
        { nom: "la moto", imageFile: "moto", definition: "Un véhicule motorisé à deux roues très rapide" },
        { nom: "la poussette", imageFile: "poussette", definition: "Petite voiture à quatre roues dans laquelle on promène un bébé ou un enfant" },
        { nom: "la fusée", imageFile: "fusee", definition: "Un engin spatial ultra rapide qui propulse les astronautes hors de la Terre" },
        { nom: "le paquebot", imageFile: "paquebot", definition: "Un très grand navire de croisière qui transporte des personnes en voyage sur mer" },
        { nom: "le skateboard", imageFile: "skateboard", definition: "Une planche à roulettes sur laquelle on se tient debout pour glisser" },
        { nom: "le sous-marin", imageFile: "sous-marin", definition: "Un navire spécial capable de naviguer entièrement sous l'eau" },
        { nom: "le taxi", imageFile: "taxi", definition: "Une voiture avec chauffeur payant qui vous emmène où vous le souhaitez" },
        { nom: "le tracteur", imageFile: "tracteur", definition: "Un véhicule d'agriculteur équipé de grandes roues pour travailler dans les champs" },
        { nom: "le train", imageFile: "train", definition: "Une suite de wagons qui roule sur des rails" },
        { nom: "la trottinette", imageFile: "trottinette", definition: "Moyen de transport urbain individuel, composé d'une plaque métallique montée sur deux roues et d'un guidon " }
    ];

    const FOLDER_PATH = "photos-moyens-de-transport/";
    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver le véhicule d'après sa description
        transportsData.forEach(item => {
            const distractors = transportsData
                .filter(x => x.nom !== item.nom)
                .map(x => capitalizeFirstLetter(x.nom));

            pool.push({
                category: "🔍 Quel est ce véhicule ?",
                text: `Quel est ce moyen de transport : <strong>${item.definition}</strong> ?`,
                correct: capitalizeFirstLetter(item.nom),
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        // Type 2 : Retrouver la fonction d'après le nom du véhicule
        transportsData.forEach(item => {
            const distractors = transportsData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Comment ça marche ?",
                text: `Comment décrire <strong>${item.nom}</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        // Gestion de l'image au format .jpg
        const imgEl = document.getElementById('transportImage');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Excellent ! C'est la bonne réponse !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Pilote Émérite !";
            msgEl.innerText = "Score parfait ! Vous connaissez absolument tous les moyens de transport !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Très Bon Voyage !";
            msgEl.innerText = "Super score ! Vous maîtrisez très bien ce domaine.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Bon Début !";
            msgEl.innerText = "C'est un bon score, continuez d'apprendre le vocabulaire des transports !";
        } else {
            emojiEl.innerText = "🧳";
            titleEl.innerText = "À Retravailler !";
            msgEl.innerText = "Examinez à nouveau la fiche et lancez une nouvelle partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
