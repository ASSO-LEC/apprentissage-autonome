<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Temps, le Calendrier & la Météo</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #EBF5FB;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .category-badge {
            display: inline-block;
            background: #E8F8F5;
            color: #16A085;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 1.3em;
            font-weight: 500;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        /* Espace autour du texte en gras */
        .question-box strong {
            margin: 0 5px;
            color: var(--primary-dark);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .btn-action:hover {
            background: var(--primary-dark);
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>Le Jeu du Temps ️</h1>
        <p class="subtitle">Jours, Mois, Saisons et Météo</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Catégorie</div>
        <div id="questionBox" class="question-box">Chargement...</div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🏆</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
    const mois = [
        "Janvier", "Février", "Mars", "Avril", "Mai", "Juin", 
        "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"
    ];
    const saisons = [
        { nom: "Printemps", emoji: "🌸", mois: ["Mars", "Avril", "Mai"] },
        { nom: "Été", emoji: "☀️", mois: ["Juin", "Juillet", "Août"] },
        { nom: "Automne", emoji: "🍂", mois: ["Septembre", "Octobre", "Novembre"] },
        { nom: "Hiver", emoji: "❄️", mois: ["Décembre", "Janvier", "Février"] }
    ];

    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // 1. Jours
        for (let i = 0; i < jours.length; i++) {
            let nextIndex = (i + 1) % 7;
            pool.push({
                category: "📅 Les Jours",
                text: `Quel jour vient <strong>après</strong> ${jours[i]} ?`,
                correct: jours[nextIndex],
                distractors: getRandomItems(jours, [jours[nextIndex], jours[i]], 3)
            });

            let prevIndex = (i - 1 + 7) % 7;
            pool.push({
                category: "📅 Les Jours",
                text: `Quel jour vient <strong>avant</strong> ${jours[i]} ?`,
                correct: jours[prevIndex],
                distractors: getRandomItems(jours, [jours[prevIndex], jours[i]], 3)
            });
        }

        // 2. Mois (espaces insécables ajoutés)
        for (let i = 0; i < mois.length; i++) {
            let nextIndex = (i + 1) % 12;
            pool.push({
                category: "🗓️ Les Mois",
                text: `Quel mois vient juste <strong>après</strong> ${mois[i]} ?`,
                correct: mois[nextIndex],
                distractors: getRandomItems(mois, [mois[nextIndex], mois[i]], 3)
            });

            let numStr = (i + 1) + (i === 0 ? 'er' : 'ème');
            pool.push({
                category: "🗓️ Les Mois",
                text: `Quel est le <strong>${numStr}</strong> mois de l'année ?`,
                correct: mois[i],
                distractors: getRandomItems(mois, [mois[i]], 3)
            });
        }

        // 3. Saisons
        saisons.forEach(s => {
            let mAssocie = s.mois[Math.floor(Math.random() * s.mois.length)];
            pool.push({
                category: "🍂 Les Saisons",
                text: `En quelle saison sommes-nous au mois de <strong>${mAssocie}</strong> ?`,
                correct: `${s.emoji} ${s.nom}`,
                distractors: saisons.filter(x => x.nom !== s.nom).map(x => `${x.emoji} ${x.nom}`)
            });
        });

        // 4. Météo
        pool.push({
            category: "🌤️ La Météo",
            text: "Que prend-on quand il y a de la <strong>pluie</strong> ? 🌧️",
            correct: "Un parapluie ☂️",
            distractors: ["Des lunettes de soleil 🕶️", "Un maillot de bain 🩱", "Une luge 🛷"]
        });

        pool.push({
            category: "🌤️ La Météo",
            text: "Que peut-on faire quand il y a de la <strong>neige</strong> ? ❄️",
            correct: "Un bonhomme de neige ☃️",
            distractors: ["Voler en cerf-volant 🪁", "Aller à la plage 🏖️", "Planter de l'herbe 🌱"]
        });

        pool.push({
            category: "🌤️ La Météo",
            text: "Que met-on quand il y a beaucoup de <strong>soleil</strong> ? ☀️",
            correct: "Des lunettes de soleil 🕶️",
            distractors: ["Un parapluie ☂️", "Un manteau très chaud 🧥", "Des bottes de pluie 👢"]
        });

        pool.push({
            category: "🌤️ La Météo",
            text: "Que peut-on faire quand il y a beaucoup de <strong>vent</strong> ? 💨",
            correct: "Faire voler un cerf-volant 🪁",
            distractors: ["Faire un bonhomme de neige ☃️", "Aller se baigner 🏊", "Dormir sous une tente ⛺"]
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! Bonne réponse !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La bonne réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon résultat 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Score Parfait !";
            msgEl.innerText = "Vous maîtrisez le temps, le calendrier et la météo à la perfection !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Très Bon Travail !";
            msgEl.innerText = "Encore un tout petit effort pour obtenir le score parfait !";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Pas Mal !";
            msgEl.innerText = "C'est un bon début, continuez à vous entraîner !";
        } else {
            emojiEl.innerText = "🌱";
            titleEl.innerText = "Continuez d'apprendre !";
            msgEl.innerText = "Recommencez une partie pour réviser et vous améliorer !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
