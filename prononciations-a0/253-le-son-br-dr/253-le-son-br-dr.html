<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prononciation : DR et BR (Interactif)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .header-bar {
            background-color: #1d4ed8;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header-bar h1 {
            margin: 0;
            font-size: 22px;
        }

        .header-bar p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .sub-header {
            max-width: 900px;
            margin: 15px auto;
            padding: 0 15px;
            font-weight: bold;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .word-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
        }

        .image-box {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            margin-bottom: 10px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .word-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        .btn-model {
            background-color: #0d9488;
            color: white;
        }

        .btn-record {
            background-color: #dc2626;
            color: white;
        }

        .btn-stop {
            background-color: #475569;
            color: white;
        }

        .btn-next {
            background-color: #0284c7;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            margin: 20px auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-shuffle {
            background-color: #8b5cf6;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .audio-player {
            width: 100%;
            margin-top: 8px;
            height: 30px;
        }

        .nav-container {
            text-align: center;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🗣️ Prononciation : DR et BR (Mélange aléatoire)</h1>
        <p>Écoutez le modèle, enregistrez-vous et comparez !</p>
    </div>

    <div class="sub-header">
        <span id="serie-info">Série 1 / 3</span>
        <button class="btn btn-shuffle" onclick="initialiserJeu()">🔀 Mélanger à nouveau</button>
    </div>

    <div class="quiz-container" id="quiz-container"></div>

    <div class="nav-container">
        <button id="btn-suite" class="btn btn-next" onclick="chargerSerieSuivante()">
            → Série suivante
        </button>
        <button id="btn-recommencer" class="btn btn-next" style="display:none;" onclick="initialiserJeu()">
            🔄 Recommencer avec un nouveau tirage
        </button>
    </div>

    <script>
        const listeComplete = [
            { texte: "DRA", image: "images/dra.jpg", audio: "audio/dra.mp3" },
            { texte: "DRE", image: "images/dre.jpg", audio: "audio/dre.mp3" },
            { texte: "DRI", image: "images/dri.jpg", audio: "audio/dri.mp3" },
            { texte: "DRO", image: "images/dro.jpg", audio: "audio/dro.mp3" },
            { texte: "DRU", image: "images/dru.jpg", audio: "audio/dru.mp3" },
            { texte: "DROU", image: "images/drou.jpg", audio: "audio/drou.mp3" },
            { texte: "BRA", image: "images/bra.jpg", audio: "audio/bra.mp3" },
            { texte: "BRE", image: "images/bre.jpg", audio: "audio/bre.mp3" },
            { texte: "BRI", image: "images/bri.jpg", audio: "audio/bri.mp3" },
            { texte: "BRO", image: "images/bro.jpg", audio: "audio/bro.mp3" },
            { texte: "BRU", image: "images/bru.jpg", audio: "audio/bru.mp3" },
            { texte: "BROU", image: "images/brou.jpg", audio: "audio/brou.mp3" }
        ];

        let seriesDistribuees = [];
        let indexSerie = 0;
        let enregistreurs = {};
        let morceauxAudio = {};

        // Algorithme de mélange aléatoire (Fisher-Yates)
        function melangerTableau(tableau) {
            const copie = [...tableau];
            for (let i = copie.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copie[i], copie[j]] = [copie[j], copie[i]];
            }
            return copie;
        }

        // Création de 3 séries de 4 cartes mélangées
        function initialiserJeu() {
            const listeMelangee = melangerTableau(listeComplete);
            seriesDistribuees = [
                listeMelangee.slice(0, 4),
                listeMelangee.slice(4, 8),
                listeMelangee.slice(8, 12)
            ];
            indexSerie = 0;
            afficherSerie(0);
        }

        function afficherSerie(numIndex) {
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";
            document.getElementById("serie-info").innerText = `Série ${numIndex + 1} /${seriesDistribuees.length}`;

            const motsSerie = seriesDistribuees[numIndex];

            motsSerie.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "word-card";

                card.innerHTML = `
                    <div class="image-box">
                        <img src="${item.image}" alt="${item.texte}">
                    </div>
                    <div class="word-title">${item.texte}</div>
                    <div class="controls-row">
                        <button class="btn btn-model" onclick="jouerAudio('${item.audio}')
