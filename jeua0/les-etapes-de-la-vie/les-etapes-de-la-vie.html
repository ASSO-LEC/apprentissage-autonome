<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Étapes de la Vie</title>
    <style>
        :root {
            --primary: #8E44AD;
            --primary-dark: #6C3483;
            --accent: #27AE60;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F5EEF8;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
            border: 2px solid #D7BDE2;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #EBDEF0;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            color: var(--primary-dark);
        }

        .category-badge {
            display: inline-block;
            background: #E8F8F5;
            color: var(--accent);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 120px;
        }

        .etapes-img {
            max-height: 160px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #D7BDE2;
            background-color: #FAFAFA;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.5;
        }

        .question-box strong {
            margin: 0 6px;
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);
        }

        .btn-action:hover {
            background: var(--primary-dark);
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary-dark);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>🌱 Les Étapes de la Vie 🎓💼</h1>
        <p class="subtitle">Retrouvez le verbe ou l'expression correspondant à l'image !</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Étaples de la vie</div>
        
        <div class="question-container">
            <img id="etapesImage" class="etapes-img" src="" alt="Photo étape de la vie" style="display: none;">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🎉</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    // Liste des 18 expressions de la planche "Les étapes de la vie"
    // Dossier d'images : photos-les-etapes-de-la-vie/
    // Fichiers au format JPG : grandir.jpg, demenager.jpg, naitre.jpg, etc.
    const etapesData = [
        { nom: "Grandir", imageFile: "grandir", definition: "Prendre de la taille et passer de l'enfance à l'âge adulte" },
        { nom: "Déménager", imageFile: "demenager", definition: "Changer de logement et transporter tous ses cartons ailleurs" },
        { nom: "Naître", imageFile: "naitre", definition: "Venir au monde, commencer sa vie en tant que bébé" },
        { nom: "S'installer", imageFile: "s-installer", definition: "Emménager dans un nouveau logement pour y vivre" },
        { nom: "Se marier", imageFile: "se-marier", definition: "S'unir officiellement avec son ou sa partenaire lors d'une cérémonie" },
        { nom: "Rester célibataire", imageFile: "rester-celibataire", definition: "Vivre seul, sans être en relation de couple" },
        { nom: "Se séparer / Rompre", imageFile: "se-separer", definition: "Mettre fin à une relation amoureuse" },
        { nom: "Faire des études", imageFile: "faire-des-etudes", definition: "Apprendre à l'école, au collège, au lycée ou à l'université" },
        { nom: "Trouver un emploi", imageFile: "trouver-un-emploi", definition: "Obtenir un travail ou signer un contrat d'embauche" },
        { nom: "Faire la connaissance de...", imageFile: "faire-la-connaissance", definition: "Rencontrer quelqu'un pour la toute première fois" },
        { nom: "Recevoir un prix", imageFile: "recevoir-un-prix", definition: "Obtenir une médaille, une récompense ou une distinction" },
        { nom: "Passer un examen", imageFile: "passer-un-examen", definition: "Faire un contrôle ou une épreuve évaluée" },
        { nom: "Réussir", imageFile: "reussir", definition: "Obtenir un bon résultat, gagner ou surmonter un épreuve avec succès" },
        { nom: "Se mettre en couple", imageFile: "se-mettre-en-couple", definition: "Débuter une relation amoureuse avec quelqu'un" },
        { nom: "Devenir célèbre", imageFile: "devenir-celebre", definition: "Être connu par un très grand nombre de personnes" },
        { nom: "Mourir", imageFile: "mourir", definition: "Arriver à la fin de sa vie" },
		{ nom: "Divorcer", imageFile: "divorcer", definition: "Mettre fin à un mariage" },
        { nom: "S'inscrire à un cours", imageFile: "s-inscrire-a-un-cours", definition: "S'engager dans une activité d'apprentissage (art, sport, langue...)" }
    
	];

    const FOLDER_PATH = "photos-les-etapes-de-la-vie/";
    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver l'expression d'après la définition
        etapesData.forEach(item => {
            const distractors = etapesData
                .filter(x => x.nom !== item.nom)
                .map(x => x.nom);

            pool.push({
                category: "🔍 Quelle est cette étape ?",
                text: `Quelle est l'action correspondant à : <strong>${item.definition}</strong> ?`,
                correct: item.nom,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        // Type 2 : Retrouver la définition d'après l'expression
        etapesData.forEach(item => {
            const distractors = etapesData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Que signifie cette expression ?",
                text: `Que veut dire l'action <strong>« ${item.nom} »</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        // Affichage de l'image .jpg
        const imgEl = document.getElementById('etapesImage');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! C'est la bonne réponse !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Oups ! La bonne réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Parfait !";
            msgEl.innerText = "Félicitations, vous maîtrisez parfaitement le vocabulaire des étapes de la vie !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Très Bon Score !";
            msgEl.innerText = "Bravo, vous avez une très bonne connaissance de ce vocabulaire.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Bon Début !";
            msgEl.innerText = "C'est un bon résultat, continuez à réviser la planche.";
        } else {
            emojiEl.innerText = "📚";
            titleEl.innerText = "À Réviser !";
            msgEl.innerText = "Relisez bien les verbes de la planche et tentez une nouvelle partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
