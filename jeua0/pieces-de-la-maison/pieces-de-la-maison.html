<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Pièces de la Maison</title>
    <style>
        :root {
            --primary: #2C3E50;
            --primary-dark: #1A252F;
            --accent: #E67E22;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #FEF9E7;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #FADBD8;
        }

        .category-badge {
            display: inline-block;
            background: #FBEEE6;
            color: #E67E22;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 1.3em;
            font-weight: 500;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        /* Empêche les mots collés autour des balises strong */
        .question-box strong {
            margin: 0 6px;
            color: var(--accent);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        .btn-action:hover {
            background: #D35400;
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>🏠 Les Pièces de la Maison 🚪</h1>
        <p class="subtitle">Vocabulaire & Définitions</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Maison & Pièces</div>
        <div id="questionBox" class="question-box">Chargement...</div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🏡</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    // Données basées exactement sur la fiche "1. Les pièces de la maison"
    const maisonData = [
        {
            nom: "La maison",
            emoji: "🏠",
            explication: "Le lieu où j'habite",
            questionDesc: "Comment appelle-t-on <strong>le lieu où j'habite</strong> ?",
            questionInvers: "Quelle est la définition de <strong>La maison</strong> ?"
        },
        {
            nom: "L'entrée",
            emoji: "🚪",
            explication: "La première pièce en arrivant",
            questionDesc: "Comment appelle-t-on <strong>la première pièce en arrivant</strong> ?",
            questionInvers: "Quelle est la définition de <strong>L'entrée</strong> ?"
        },
        {
            nom: "Le salon",
            emoji: "🛋️",
            explication: "La pièce pour se reposer, regarder la TV",
            questionDesc: "Comment appelle-t-on <strong>la pièce pour se reposer, regarder la TV</strong> ?",
            questionInvers: "Quelle est la définition du <strong>Salon</strong> ?"
        },
        {
            nom: "La cuisine",
            emoji: "🍳",
            explication: "La pièce pour cuisiner",
            questionDesc: "Comment appelle-t-on <strong>la pièce pour cuisiner</strong> ?",
            questionInvers: "Quelle est la définition de <strong>La cuisine</strong> ?"
        },
        {
            nom: "La salle de bain",
            emoji: "🛁",
            explication: "La pièce pour se laver",
            questionDesc: "Comment appelle-t-on <strong>la pièce pour se laver</strong> ?",
            questionInvers: "Quelle est la définition de <strong>La salle de bain</strong> ?"
        },
        {
            nom: "Les toilettes / WC",
            emoji: "🚽",
            explication: "La pièce pour aller aux toilettes",
            questionDesc: "Comment appelle-t-on <strong>la pièce pour aller aux toilettes</strong> ?",
            questionInvers: "Quelle est la définition des <strong>Toilettes / WC</strong> ?"
        },
        {
            nom: "La chambre",
            emoji: "🛏️",
            explication: "La pièce pour dormir",
            questionDesc: "Comment appelle-t-on <strong>la pièce pour dormir</strong> ?",
            questionInvers: "Quelle est la définition de <strong>La chambre</strong> ?"
        },
        {
            nom: "Le couloir",
            emoji: "🚪",
            explication: "Le passage entre les pièces",
            questionDesc: "Comment appelle-t-on <strong>le passage entre les pièces</strong> ?",
            questionInvers: "Quelle est la définition du <strong>Couloir</strong> ?"
        },
        {
            nom: "Le balcon",
            emoji: "🪴",
            explication: "Petit espace dehors",
            questionDesc: "Comment appelle-t-on le <strong>petit espace dehors</strong> ?",
            questionInvers: "Quelle est la définition du <strong>Balcon</strong> ?"
        }
    ];

    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Deviner la pièce d'après l'explication
        maisonData.forEach(item => {
            const distractors = maisonData
                .filter(x => x.nom !== item.nom)
                .map(x => `${x.emoji} ${x.nom}`);

            pool.push({
                category: "🏠 Devine la pièce",
                text: item.questionDesc,
                correct: `${item.emoji} ${item.nom}`,
                distractors: getRandomItems(distractors, [], 3)
            });
        });

        // Type 2 : Deviner l'explication d'après le nom de la pièce
        maisonData.forEach(item => {
            const distractors = maisonData
                .filter(x => x.explication !== item.explication)
                .map(x => x.explication);

            pool.push({
                category: "💡 Quelle est la fonction ?",
                text: item.questionInvers,
                correct: item.explication,
                distractors: getRandomItems(distractors, [], 3)
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! C'est la bonne réponse !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Parfait !";
            msgEl.innerText = "Vous connaissez toutes les pièces de la maison sur le bout des doigts !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Très Bien !";
            msgEl.innerText = "Super travail, encore un petit effort pour le sans-faute !";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Pas Mal !";
            msgEl.innerText = "C'est un bon début, continuez de réviser le vocabulaire !";
        } else {
            emojiEl.innerText = "🏡";
            titleEl.innerText = "Continuez d'apprendre !";
            msgEl.innerText = "Relisez la fiche de cours et rejouez une partie pour vous entraîner.";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
