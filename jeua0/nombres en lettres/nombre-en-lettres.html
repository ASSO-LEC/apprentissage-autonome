<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nombres en lettres</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            line-height: 1.6; 
            margin: 20px; 
            background-color: #f4f4f9; 
        }
        .container { 
            max-width: 700px; 
            margin: 0 auto;
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: #2c3e50; 
            text-align: center;
            margin-bottom: 20px;
        }
        .instruction {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 25px;
        }
        .grid-questions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px 30px;
            margin-bottom: 25px;
        }
        @media (max-width: 550px) {
            .grid-questions {
                grid-template-columns: 1fr;
            }
        }
        .question-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1em;
            font-weight: bold;
            color: #34495e;
            background: #fafafa;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        input { 
            width: 160px; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 0.95em;
            color: #2c3e50; 
            transition: all 0.2s;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button { 
            padding: 12px 20px; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-check {
            background-color: #27ae60; 
        }
        .btn-check:hover { 
            background-color: #219a52; 
        }
        .btn-reset {
            background-color: #2980b9;
        }
        .btn-reset:hover {
            background-color: #1f618d;
        }
        .result { 
            margin-top: 25px; 
            font-weight: bold; 
            font-size: 1.3em; 
            text-align: center;
            min-height: 30px;
        }
        .correct { 
            border: 2px solid #27ae60 !important; 
            background-color: #e8f8f5 !important; 
        }
        .incorrect { 
            border: 2px solid #e74c3c !important; 
            background-color: #fce4d6 !important; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Écrire les nombres en toutes lettres</h1>
    <p class="instruction">Saisissez l'écriture correcte en français (ex: <i>vingt-et-un</i> ou <i>vingt et un</i> sont acceptés).</p>
    
    <div id="questionsContainer" class="grid-questions"></div>
    
    <div class="button-group">
        <button class="btn-check" onclick="verifier()">Vérifier mes réponses par JPJ</button>
        <button class="btn-reset" onclick="genererNouvelleSerie()">🔄 Nouvelle série (10 nombres)</button>
    </div>

    <div class="result" id="resultat"></div>
</div>

<script>
    // Dictionnaire pour la génération automatique des nombres en français (0 à 100)
    const unites = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
    const dizaines = ["", "", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante-dix", "quatre-vingt", "quatre-vingt-dix"];

    function nombreEnLettres(n) {
        if (n < 20) return unites[n];
        if (n === 80) return "quatre-vingts";
        if (n === 100) return "cent";

        let d = Math.floor(n / 10);
        let u = n % 10;

        if (d === 7) {
            if (u === 1) return "soixante-et-onze";
            return "soixante-" + unites[10 + u];
        }
        if (d === 9) {
            return "quatre-vingt-" + unites[10 + u];
        }

        if (u === 0) return dizaines[d];
        if (u === 1) return dizaines[d] + "-et-un";

        return dizaines[d] + "-" + unites[u];
    }

    let nombresActuels = [];

    function genererNouvelleSerie() {
        const container = document.getElementById('questionsContainer');
        const resultatDiv = document.getElementById('resultat');
        container.innerHTML = '';
        resultatDiv.innerText = '';
        nombresActuels = [];

        // Générer 10 nombres uniques entre 0 et 100
        while (nombresActuels.length < 10) {
            let n = Math.floor(Math.random() * 101);
            if (!nombresActuels.includes(n)) {
                nombresActuels.push(n);
            }
        }

        // Créer les éléments HTML
        nombresActuels.forEach((num, index) => {
            let reponseCorrecte = nombreEnLettres(num);
            
            let item = document.createElement('div');
            item.className = 'question-item';
            item.innerHTML = `
                <span>${num} =</span>
                <input type="text" id="v${index}" data-ans="${reponseCorrecte}" autocomplete="off" spellcheck="false">
            `;
            container.appendChild(item);
        });
    }

    function normaliserChaine(str) {
        // Permet de tolérer les espaces au lieu des tirets (ex: "vingt et un" ou "vingt-et-un")
        return str.trim().toLowerCase().replace(/\s+/g, '-');
    }

    function verifier() {
        let score = 0;
        let total = 10;

        for (let i = 0; i < total; i++) {
            let input = document.getElementById('v' + i);
            let reponseSaisie = normaliserChaine(input.value);
            let reponseAttendue = normaliserChaine(input.getAttribute('data-ans'));

            // Tolérance pour "quatre-vingt" ou "quatre-vingts"
            let estValide = (reponseSaisie === reponseAttendue);
            if (!estValide && reponseAttendue === "quatre-vingts" && reponseSaisie === "quatre-vingt") {
                estValide = true;
            }

            if (estValide && input.value.trim() !== "") {
                input.className = 'correct';
                score++;
            } else {
                input.className = 'incorrect';
            }
        }

        let resultDiv = document.getElementById('resultat');
        resultDiv.innerText = "Score : " + score + " / " + total;
        if (score === total) {
            resultDiv.style.color = "#27ae60";
            resultDiv.innerText += " 🏆 Bravo ! C'est un sans-faute !";
        } else {
            resultDiv.style.color = "#c0392b";
        }
    }

    // Charger une première série au lancement
    window.onload = genererNouvelleSerie;
</script>
<script src="../../../securite.js"></script>
</body>
</html>
