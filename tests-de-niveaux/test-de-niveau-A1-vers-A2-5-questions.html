<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test A1/A2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .context {
            font-style: italic;
            background-color: #eef2f3;
            padding: 10px;
            border-left: 4px solid #3498db;
            margin-bottom: 15px;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            margin-bottom: 10px;
        }
        button.option-btn {
            width: 100%;
            text-align: left;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        button.option-btn:hover {
            background-color: #e0eae9;
            border-color: #3498db;
        }
        .result-container {
            text-align: center;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #27ae60;
            margin: 15px 0 5px 0;
        }
        .niveau {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2980b9;
        }
        .restart-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 25px;
            font-size: 1rem;
            font-weight: bold;
        }
        .restart-btn:hover {
            background-color: #2980b9;
        }

        /* --- Nouveaux styles pour le rapport détaillé --- */
        .report-section {
            margin-top: 30px;
            text-align: left;
        }
        .report-section h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            border-bottom: 2px solid #eef2f3;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .report-card {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .report-card.correct-card {
            border-left: 5px solid #27ae60;
        }
        .report-card.incorrect-card {
            border-left: 5px solid #e74c3c;
        }
        .report-card .q-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .report-card .ans-user {
            margin-top: 5px;
            font-size: 0.95rem;
        }
        .report-card .ans-correct {
            margin-top: 3px;
            font-size: 0.95rem;
            color: #27ae60;
            font-weight: 600;
        }
        .text-success {
            color: #27ae60;
            font-weight: 600;
        }
        .text-error {
            color: #e74c3c;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <!-- Le contenu sera injecté par JavaScript -->
</div>

<script>
// 1. Les données du QCM
const quizData = [
    {
        question: "1. Conjugaison (Le passé) : Complète la phrase suivante au temps qui convient :",
        context: "« Hier, je/j' _________ au restaurant avec ma famille. »",
        options: [
            { text: "A) mange", isCorrect: false },
            { text: "B) ai mangé", isCorrect: true },
            { text: "C) vais manger", isCorrect: false }
        ]
    },
    {
        question: "2. Les connecteurs logiques : Choisis le mot correct pour lier les deux phrases :",
        context: "« Je ne vais pas au travail aujourd'hui _________ je suis malade. »",
        options: [
            { text: "A) mais", isCorrect: false },
            { text: "B) et", isCorrect: false },
            { text: "C) parce que", isCorrect: true }
        ]
    },
    {
        question: "3. Compréhension écrite : Lis ce message et choisis la bonne affirmation :",
        context: "« Salut Thomas ! Ce soir, je t'attends à la maison à 19h pour le dîner. N'oublie pas d'apporter le pain. À tout à l'heure, Pauline. »",
        options: [
            { text: "A) Thomas invite Pauline à dîner.", isCorrect: false },
            { text: "B) Thomas doit acheter du pain avant d'aller chez Pauline.", isCorrect: true },
            { text: "C) Le dîner est à midi.", isCorrect: false }
        ]
    },
    {
        question: "4. Vocabulaire (Les magasins) :",
        context: "Où va-t-on pour acheter des médicaments en France ?",
        options: [
            { text: "A) À la boulangerie", isCorrect: false },
            { text: "B) À la pharmacie", isCorrect: true },
            { text: "C) À la bibliothèque", isCorrect: false }
        ]
    },
    {
        question: "5. Expression écrite : Laquelle de ces trois réponses est la plus naturelle pour un niveau A2 à la question :",
        context: "« Qu'est-ce que tu as fait le week-end dernier ? »",
        options: [
            { text: "A) « Week-end bon. Plage et soleil. »", isCorrect: false },
            { text: "B) « Le week-end dernier, je suis allé à la plage avec des amis. Samedi soir, nous avons mangé dans un petit restaurant très sympa. »", isCorrect: true },
            { text: "C) « Le week-end, je vais à la plage. J'aime le soleil. »", isCorrect: false }
        ]
    }
];

// 2. Variables pour suivre l'état du jeu
let currentQuestionIndex = 0;
let score = 0;
let userAnswers = []; // Stocke les choix enregistrés de l'utilisateur

const quizContainer = document.getElementById('quiz');

// 3. Fonction pour afficher une question
function loadQuestion() {
    const currentQuestion = quizData[currentQuestionIndex];
    
    let htmlContent = `
        <div class="question">${currentQuestion.question}</div>
        <div class="context">${currentQuestion.context}</div>
        <ul class="options">
    `;
    
    currentQuestion.options.forEach((option, index) => {
        htmlContent += `
            <li>
                <button class="option-btn" onclick="selectOption(${index})">
                    ${option.text}
                </button>
            </li>
        `;
    });
    
    htmlContent += `</ul>`;
    quizContainer.innerHTML = htmlContent;
}

// 4. Fonction appelée quand l'utilisateur clique sur une réponse
function selectOption(optionIndex) {
    const currentQuestion = quizData[currentQuestionIndex];
    const selectedOption = currentQuestion.options[optionIndex];

    // Sauvegarde la réponse
    userAnswers.push({
        question: currentQuestion.question,
        context: currentQuestion.context,
        selectedText: selectedOption.text,
        isCorrect: selectedOption.isCorrect,
        correctText: currentQuestion.options.find(opt => opt.isCorrect).text
    });

    if (selectedOption.isCorrect) {
        score++;
    }
    
    currentQuestionIndex++;
    
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

// 5. Fonction pour afficher le bilan final avec le rapport détaillé
function showResults() {
    let niveau = "";
    let conseils = "";
    
    if (score === 5) {
        niveau = "Niveau A2 validé !";
        conseils = "Félicitations ! Tu maîtrises bien les bases du niveau A2 (les temps du passé, la structure des phrases et les connecteurs). Tu es prêt pour attaquer le niveau B1 !";
    } else if (score >= 3) {
        niveau = "En transition vers le A2";
        conseils = "Bon travail ! Tu as de bonnes bases. Tu commences à comprendre les structures de phrases plus complexes, continue tes efforts pour stabiliser le passé composé.";
    } else {
        niveau = "Niveau A1";
        conseils = "C'est un bon début ! Tu es actuellement au niveau A1. Prends le temps de bien réviser le présent des verbes et le vocabulaire de la vie quotidienne pour progresser.";
    }

    // Construction du rapport détaillé
    let reportHtml = `<div class="report-section"><h2>Rapport détaillé</h2>`;
    
    userAnswers.forEach((item, idx) => {
        const cardClass = item.isCorrect ? "correct-card" : "incorrect-card";
        const statusText = item.isCorrect 
            ? `<span class="text-success">✓ Correct</span>` 
            : `<span class="text-error">✗ Incorrect</span>`;

        reportHtml += `
            <div class="report-card ${cardClass}">
                <div class="q-title">Question ${idx + 1}: ${statusText}</div>
                <div><em>${item.context}</em></div>
                <div class="ans-user">
                    Votre réponse : <strong class="${item.isCorrect ? 'text-success' : 'text-error'}">${item.selectedText}</strong>
                </div>
                ${!item.isCorrect ? `<div class="ans-correct">Réponse attendue : ${item.correctText}</div>` : ''}
            </div>
        `;
    });
    
    reportHtml += `</div>`;

    quizContainer.innerHTML = `
        <div class="result-container">
            <h1>Résultats du Test</h1>
            <div class="score">${score} / ${quizData.length}</div>
            <div class="niveau">${niveau}</div>
            <p style="margin-top: 15px; line-height: 1.5;">${conseils}</p>
            
            ${reportHtml}

            <button class="restart-btn" onclick="restartQuiz()">Recommencer le test</button>
        </div>
    `;
}

// 6. Fonction pour relancer le QCM
function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    userAnswers = [];
    loadQuestion();
}

// Lancement initial du quiz
loadQuestion();
</script>
<script src="../securite.js"></script>
</body>
</html>
