<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Professions </title>
    <style>
        :root {
            --primary: #34495E;
            --primary-dark: #2C3E50;
            --accent: #2980B9;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #EBF5FB;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #AED6F1;
        }

        .category-badge {
            display: inline-block;
            background: #E8F8F5;
            color: #16A085;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Container de la question avec image */
        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 120px;
        }

        .profession-img {
            max-height: 160px;
            max-width: 160px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #E5E8E8;
            background-color: #FAFAFA;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.5;
        }

        .question-box strong {
            margin: 0 6px;
            color: var(--accent);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3);
        }

        .btn-action:hover {
            background: #1F618D;
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>💼 🛠️  Les Professions  👨‍🍳 👩‍⚕️</h1>
        <p class="subtitle">Devinez le métier ou sa définition !</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Métiers</div>
        
        <div class="question-container">
            <img id="professionImage" class="profession-img" src="" alt="Photo du métier" style="display: none;">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🎓</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    // Liste des 25 professions
    // Dossier d'images : photos-les-professions/
    // Fichiers au format JPG : chauffeur.jpg, detective.jpg, etc.
    const professionsData = [
        { nom: "chauffeur", imageFile: "chauffeur", definition: "Conduit un véhicule pour transporter des personnes" },
        { nom: "détective", imageFile: "detective", definition: "Mène des enquêtes pour chercher des indices et résoudre des mystères" },
        { nom: "plombier", imageFile: "plombier", definition: "Répare les tuyaux, les robinets et les fuites d'eau" },
        { nom: "vétérinaire", imageFile: "veterinaire", definition: "Soigne et prend soin des animaux malades" },
        { nom: "ingénieur", imageFile: "ingenieur", definition: "Conçoit et construit des machines ou de grands projets techniques" },
        { nom: "programmeur", imageFile: "programmeur", definition: "Écrit des lignes de code pour créer des logiciels et des applications" },
        { nom: "soudeur", imageFile: "soudeur", definition: "Assemble des pièces de métal en les chauffant très fort" },
        { nom: "dompteur", imageFile: "dompteur", definition: "Dresse et fait exécuter des tours aux animaux sauvages" },
        { nom: "architecte", imageFile: "architecte", definition: "Dessine les plans pour construire des maisons et des immeubles" },
        { nom: "jardinier", imageFile: "jardinier", definition: "S'occupe des plantes, des fleurs et entretient les jardins" },
        { nom: "infirmière", imageFile: "infirmiere", definition: "Donne des soins et fait des piqûres aux patients sur ordonnance" },
        { nom: "chirurgien", imageFile: "chirurgien", definition: "Opère les patients à l'hôpital pour les guérir" },
        { nom: "médecin", imageFile: "medecin", definition: "Examine les malades, fait des diagnostics et prescrit des médicaments" },
        { nom: "facteur", imageFile: "facteur", definition: "Distribue les lettres et les colis dans les boîtes aux lettres" },
        { nom: "réceptionniste", imageFile: "receptionniste", definition: "Accueille les clients et répond au téléphone à l'entrée d'un bâtiment" },
        { nom: "diseuse de bonne aventure", imageFile: "diseuse", definition: "Prétend prédire l'avenir avec une boule de cristal ou des cartes" },
        { nom: "astronaute", imageFile: "astronaute", definition: "Voyage dans l'espace à bord d'une fusée ou d'une station spatiale" },
        { nom: "pilote d'avion", imageFile: "pilote", definition: "Conduit les avions pour transporter des voyageurs à travers le monde" },
        { nom: "hôtesse de l'air", imageFile: "hotesse", definition: "Accueille et veille à la sécurité des passagers à bord d'un avion" },
        { nom: "poissonnier", imageFile: "poissonnier", definition: "Vend du poisson frais et des fruits de mer" },
        { nom: "boucher", imageFile: "boucher", definition: "Prépare et vend de la viande" },
        { nom: "chef pâtissier", imageFile: "chef", definition: "Prépare de délicieux gâteaux, tartes et desserts" },
        { nom: "boulanger", imageFile: "boulanger", definition: "Fabrique et cuit le pain et les viennoiseries" },
        { nom: "vendeur de fruits", imageFile: "vendeur", definition: "Vend des fruits frais et des légumes sur le marché ou en magasin" },
        { nom: "plongeur", imageFile: "plongeur", definition: "Nage sous l'eau avec des bouteilles d'oxygène" }
    ];

    const FOLDER_PATH = "photos-les-professions/";
    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver le métier à partir de sa définition
        professionsData.forEach(item => {
            const distractors = professionsData
                .filter(x => x.nom !== item.nom)
                .map(x => capitalizeFirstLetter(x.nom));

            pool.push({
                category: "🔍 Quel est ce métier ?",
                text: `Qui est la personne dont le métier est : <strong>${item.definition}</strong> ?`,
                correct: capitalizeFirstLetter(item.nom),
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        // Type 2 : Retrouver la définition à partir du nom du métier
        professionsData.forEach(item => {
            const distractors = professionsData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Quelle est la tâche ?",
                text: `Que fait le / la <strong>${item.nom}</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        // Gestion de l'image au format .jpg
        const imgEl = document.getElementById('professionImage');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! C'est exactement ça !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Dommage ! La bonne réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏆";
            titleEl.innerText = "Expert des Métiers !";
            msgEl.innerText = "Félicitations, vous connaissez parfaitement toutes les professions !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🌟";
            titleEl.innerText = "Bravo !";
            msgEl.innerText = "Très bon score ! Vous maîtrisez une grande partie des métiers.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "👍";
            titleEl.innerText = "Pas mal !";
            msgEl.innerText = "C'est un bon résultat, continuez à réviser le vocabulaire.";
        } else {
            emojiEl.innerText = "📚";
            titleEl.innerText = "À travailler !";
            msgEl.innerText = "Relisez la planche des professions et réessayez une partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
