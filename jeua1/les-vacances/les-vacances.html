<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Vacances</title>
    <style>
        :root {
            --primary: #E67E22;
            --primary-dark: #D35400;
            --accent: #16A085;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #FEF9E7;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
            border: 2px solid #F9E79F;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2em;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #FCF3CF;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1em;
            color: var(--primary-dark);
        }

        .category-badge {
            display: inline-block;
            background: #E8F8F5;
            color: var(--accent);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 120px;
        }

        .vacances-img {
            max-height: 160px;
            max-width: 180px;
            object-fit: contain;
            border-radius: 12px;
            border: 3px solid #F9E79F;
            background-color: #FAFAFA;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.25em;
            font-weight: 500;
            line-height: 1.5;
        }

        .question-box strong {
            margin: 0 6px;
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 550px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background: #F0F3F4;
            border: 2px solid #E5E8E8;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-option:hover {
            background: #E5E8E8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        .feedback-box {
            min-height: 30px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        .btn-action:hover {
            background: var(--primary-dark);
        }

        .score-screen {
            display: none;
        }

        .score-screen h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: var(--primary-dark);
        }

        .score-details {
            font-size: 1.4em;
            margin-bottom: 25px;
        }

        .emoji-big {
            font-size: 4em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Écran de jeu -->
    <div id="gameScreen">
        <h1>☀️ Les Vacances ️🌴</h1>
        <p class="subtitle">Devinez l'objet, l'activité ou le mot sur les vacances !</p>

        <div class="stats-bar">
            <span>Question : <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">10</span></span>
            <span>Score : <span id="score">0</span> / <span id="maxScore">10</span></span>
        </div>

        <div id="categoryBadge" class="category-badge">Vacances</div>
        
        <div class="question-container">
            <img id="vacancesImage" class="vacances-img" src="" alt="Photo des vacances" style="display: none;">
            <div id="questionBox" class="question-box">Chargement...</div>
        </div>

        <div id="optionsGrid" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-box"></div>

        <div>
            <button id="nextBtn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante ➔</button>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="scoreScreen" class="score-screen">
        <div id="endEmoji" class="emoji-big">🍹</div>
        <h2 id="endTitle">Bravo !</h2>
        <div class="score-details">
            Votre score : <strong id="finalScore">0</strong> sur <span id="finalTotal">10</span>
        </div>
        <p id="endMessage" style="margin-bottom: 25px; color: #7F8C8D; font-size: 1.1em;"></p>
        <button class="btn-action" onclick="restartGame()">🔄 Recommencer une nouvelle partie avec JPJ</button>
    </div>
</div>

<script>
    // Liste des 25 éléments de la planche de vocabulaire des vacances
    // Dossier d'images : photos-les-vacances/
    // Fichiers au format JPG : clef.jpg, coquillages.jpg, orage.jpg, etc.
    const vacancesData = [
        { nom: "la clé de la chambre", imageFile: "clef", definition: "Permet d'ouvrir la porte de son logement ou de sa chambre d'hôtel" },
        { nom: "les coquillages", imageFile: "coquillages", definition: "De petites coquilles ramassées sur le sable au bord de la mer" },
        { nom: "l'orage", imageFile: "orage", definition: "Un phénomène météo avec des éclairs, du tonnerre et de la pluie" },
        { nom: "les palmes", imageFile: "palmes", definition: "Accessoires qu'on met aux pieds pour nager plus vite sous l'eau" },
        { nom: "le maillot de bain", imageFile: "maillot", definition: "Le vêtement que l'on porte pour aller se baigner à la plage ou à la piscine" },
        { nom: "les chaises longues et le parasol", imageFile: "parasol", definition: "L'équipement parfait pour s'allonger à l'ombre sur la plage" },
        { nom: "la chaleur", imageFile: "chaleur", definition: "Quand la température est très élevée pendant les beaux jours d'été" },
        { nom: "le sac de couchage", imageFile: "sac-de-couchage", definition: "Un grand sac chaud dans lequel on dort quand on fait du camping" },
        { nom: "la croisière", imageFile: "croisiere", definition: "Un grand voyage de vacances à bord d'un navire de tourisme" },
        { nom: "le coucher de soleil", imageFile: "coucher-de-soleil", definition: "Le moment de fin de journée où le soleil disparaît à l'horizon" },
        { nom: "les chambres d'hôtes", imageFile: "chambres-dhotes", definition: "Un hébergement chaleureux chez des particuliers qui accueillent des voyageurs" },
        { nom: "les tongs", imageFile: "tongs", definition: "Des chaussures légères et ouvertes très pratiques pour aller sur le sable" },
        { nom: "la tente", imageFile: "tente", definition: "Une abri en toile sous lequel on dort quand on va au camping" },
        { nom: "prendre des photos", imageFile: "photos", definition: "Capturer des images avec un appareil pour garder de beaux souvenirs" },
        { nom: "l'île", imageFile: "ile", definition: "Une étendue de terre complètement entourée par l'eau" },
        { nom: "l'étranger", imageFile: "etranger", definition: "Voyager dans un autre pays que le sien" },
        { nom: "la plongée", imageFile: "plongee", definition: "Nager sous l'eau avec un masque pour observer les poissons" },
        { nom: "le coup de soleil", imageFile: "coup-de-soleil", definition: "Une brûlure rouge sur la peau quand on reste trop longtemps au soleil sans crème" },
        { nom: "le drap de plage", imageFile: "drap-de-plage", definition: "Une grande serviette qu'on étale sur le sable pour s'allonger" },
        { nom: "l'hébergement", imageFile: "hebergement", definition: "Le lieu où l'on loge ou dort pendant les vacances (hôtel, camping...)" },
        { nom: "la bouée de sauvetage", imageFile: "bouee", definition: "Un anneau flottant servant à secourir les personnes dans l'eau" },
        { nom: "prendre un bain de soleil", imageFile: "bain-de-soleil", definition: "S'allonger au soleil pour bronzer et se détendre" },
        { nom: "la randonnée", imageFile: "randonnee", definition: "Une longue promenade à pied dans la nature ou à la montagne" },
        { nom: "les renseignements", imageFile: "renseignements", definition: "S'informer auprès de l'Office de Tourisme pour savoir quoi visiter" },
        { nom: "la location de voiture", imageFile: "location-voiture", definition: "Louer un véhicule pour pouvoir se déplacer librement pendant ses vacances" }
    ];

    const FOLDER_PATH = "photos-les-vacances/";
    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let canAnswer = true;

    function generateRandomQuestions() {
        let pool = [];

        // Type 1 : Retrouver l'élément d'après la définition
        vacancesData.forEach(item => {
            const distractors = vacancesData
                .filter(x => x.nom !== item.nom)
                .map(x => capitalizeFirstLetter(x.nom));

            pool.push({
                category: "🔍 De quoi s'agit-il ?",
                text: `Que désigne la définition : <strong>${item.definition}</strong> ?`,
                correct: capitalizeFirstLetter(item.nom),
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        // Type 2 : Retrouver la définition d'après le nom
        vacancesData.forEach(item => {
            const distractors = vacancesData
                .filter(x => x.definition !== item.definition)
                .map(x => x.definition);

            pool.push({
                category: "💡 Qu'est-ce que c'est ?",
                text: `Que veut dire <strong>${item.nom}</strong> ?`,
                correct: item.definition,
                distractors: getRandomItems(distractors, [], 3),
                image: `${FOLDER_PATH}${item.imageFile}.jpg`
            });
        });

        shuffleArray(pool);
        return pool.slice(0, TOTAL_QUESTIONS);
    }

    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    function getRandomItems(array, excludeArray, count) {
        let filtered = array.filter(item => !excludeArray.includes(item));
        shuffleArray(filtered);
        return filtered.slice(0, count);
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startGame() {
        questions = generateRandomQuestions();
        currentQuestionIndex = 0;
        score = 0;
        canAnswer = true;

        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('scoreScreen').style.display = 'none';
        document.getElementById('totalQuestionsNum').innerText = TOTAL_QUESTIONS;
        document.getElementById('maxScore').innerText = TOTAL_QUESTIONS;

        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        const q = questions[currentQuestionIndex];

        document.getElementById('currentQuestionNum').innerText = currentQuestionIndex + 1;
        document.getElementById('score').innerText = score;
        document.getElementById('categoryBadge').innerText = q.category;
        
        document.getElementById('questionBox').innerHTML = q.text;

        // Affichage de l'image .jpg
        const imgEl = document.getElementById('vacancesImage');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
        } else {
            imgEl.style.display = 'none';
        }

        document.getElementById('feedbackBox').innerText = '';
        document.getElementById('nextBtn').style.display = 'none';

        let options = [q.correct, ...q.distractors];
        shuffleArray(options);

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.correct);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue, correctValue) {
        if (!canAnswer) return;
        canAnswer = false;

        const allButtons = document.querySelectorAll('.btn-option');
        const feedback = document.getElementById('feedbackBox');

        if (selectedValue === correctValue) {
            selectedBtn.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            feedback.innerText = "✨ Bravo ! C'est la bonne réponse !";
            feedback.style.color = "var(--success)";
        } else {
            selectedBtn.classList.add('wrong');
            feedback.innerText = `❌ Oups ! La bonne réponse était : ${correctValue}`;
            feedback.style.color = "var(--error)";

            allButtons.forEach(btn => {
                if (btn.innerText === correctValue) {
                    btn.classList.add('correct');
                }
            });
        }

        if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
            document.getElementById('nextBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').innerText = 'Voir mon score final 🏆';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_QUESTIONS) {
            document.getElementById('nextBtn').innerText = 'Question suivante ➔';
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('scoreScreen').style.display = 'block';

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalTotal').innerText = TOTAL_QUESTIONS;

        const emojiEl = document.getElementById('endEmoji');
        const titleEl = document.getElementById('endTitle');
        const msgEl = document.getElementById('endMessage');

        let percentage = (score / TOTAL_QUESTIONS) * 100;

        if (percentage === 100) {
            emojiEl.innerText = "🏖️";
            titleEl.innerText = "Champion des Vacances !";
            msgEl.innerText = "Score parfait ! Vous connaissez parfaitement le vocabulaire des vacances !";
        } else if (percentage >= 70) {
            emojiEl.innerText = "🕶️";
            titleEl.innerText = "Très Bon Voyage !";
            msgEl.innerText = "Super score ! Vous êtes paré pour les vacances.";
        } else if (percentage >= 50) {
            emojiEl.innerText = "☀️";
            titleEl.innerText = "Bon Début !";
            msgEl.innerText = "Bon travail, continuez à réviser la fiche du vocabulaire.";
        } else {
            emojiEl.innerText = "🧳";
            titleEl.innerText = "À Réviser !";
            msgEl.innerText = "Regardez de nouveau les images de la planche et tentez une nouvelle partie !";
        }
    }

    function restartGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
